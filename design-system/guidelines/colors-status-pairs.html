<!-- @dsCard group="Colors" viewport="700x120" name="Status pill triples" subtitle="Each state is a bg / fg / border set, always with a glyph and a word" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row"><div class="sw" style="min-width:120px">
  <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--status-draft-bg);color:var(--status-draft-fg);border:1px solid var(--status-draft-border);font:var(--type-caption);font-weight:var(--weight-medium);width:max-content">
  <span style="width:11px;height:11px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/pencil-line.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/pencil-line.svg) center/contain no-repeat"></span>Draft</span>
  <span class="tok">--status-draft-*</span></div><div class="sw" style="min-width:120px">
  <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--status-validated-bg);color:var(--status-validated-fg);border:1px solid var(--status-validated-border);font:var(--type-caption);font-weight:var(--weight-medium);width:max-content">
  <span style="width:11px;height:11px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/list-checks.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/list-checks.svg) center/contain no-repeat"></span>Validated</span>
  <span class="tok">--status-validated-*</span></div><div class="sw" style="min-width:120px">
  <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--status-approved-bg);color:var(--status-approved-fg);border:1px solid var(--status-approved-border);font:var(--type-caption);font-weight:var(--weight-medium);width:max-content">
  <span style="width:11px;height:11px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/user-check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/user-check.svg) center/contain no-repeat"></span>Approved</span>
  <span class="tok">--status-approved-*</span></div><div class="sw" style="min-width:120px">
  <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--status-posted-bg);color:var(--status-posted-fg);border:1px solid var(--status-posted-border);font:var(--type-caption);font-weight:var(--weight-medium);width:max-content">
  <span style="width:11px;height:11px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/lock.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/lock.svg) center/contain no-repeat"></span>Posted</span>
  <span class="tok">--status-posted-*</span></div><div class="sw" style="min-width:120px">
  <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--status-failed-bg);color:var(--status-failed-fg);border:1px solid var(--status-failed-border);font:var(--type-caption);font-weight:var(--weight-medium);width:max-content">
  <span style="width:11px;height:11px;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/x.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/x.svg) center/contain no-repeat"></span>Failed</span>
  <span class="tok">--status-failed-*</span></div></div>
</body>
</html>
