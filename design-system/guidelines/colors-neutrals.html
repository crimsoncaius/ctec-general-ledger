<!-- @dsCard group="Colors" viewport="700x130" name="Cool neutrals" subtitle="The whole workspace sits on these; chroma is near zero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:#ffffff"></div><span class="tok">--n-0</span><span class="val">#ffffff</span></div><div class="sw"><div class="chip" style="background:#fafbfc"></div><span class="tok">--n-25</span><span class="val">#fafbfc</span></div><div class="sw"><div class="chip" style="background:#f4f6f8"></div><span class="tok">--n-50</span><span class="val">#f4f6f8</span></div><div class="sw"><div class="chip" style="background:#eaedf1"></div><span class="tok">--n-100</span><span class="val">#eaedf1</span></div><div class="sw"><div class="chip" style="background:#dbe0e6"></div><span class="tok">--n-200</span><span class="val">#dbe0e6</span></div><div class="sw"><div class="chip" style="background:#c3cad3"></div><span class="tok">--n-300</span><span class="val">#c3cad3</span></div><div class="sw"><div class="chip" style="background:#9aa4b1"></div><span class="tok">--n-400</span><span class="val">#9aa4b1</span></div><div class="sw"><div class="chip" style="background:#6f7987"></div><span class="tok">--n-500</span><span class="val">#6f7987</span></div></div><div class="row"><div class="sw"><div class="chip" style="background:#545d6a"></div><span class="tok">--n-600</span><span class="val">#545d6a</span></div><div class="sw"><div class="chip" style="background:#3c4450"></div><span class="tok">--n-700</span><span class="val">#3c4450</span></div><div class="sw"><div class="chip" style="background:#272d37"></div><span class="tok">--n-800</span><span class="val">#272d37</span></div><div class="sw"><div class="chip" style="background:#171b22"></div><span class="tok">--n-900</span><span class="val">#171b22</span></div></div>
</body>
</html>
