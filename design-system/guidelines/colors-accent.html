<!-- @dsCard group="Colors" viewport="700x110" name="Slate blue accent" subtitle="One brand hue: identity, focus, primary action" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:#eef3fb"></div><span class="tok">--blue-50</span><span class="val">#eef3fb</span></div><div class="sw"><div class="chip" style="background:#d8e4f6"></div><span class="tok">--blue-100</span><span class="val">#d8e4f6</span></div><div class="sw"><div class="chip" style="background:#b3caec"></div><span class="tok">--blue-200</span><span class="val">#b3caec</span></div><div class="sw"><div class="chip" style="background:#6f95d0"></div><span class="tok">--blue-300</span><span class="val">#6f95d0</span></div><div class="sw"><div class="chip" style="background:#1f4b99"></div><span class="tok">--blue-500</span><span class="val">base</span></div><div class="sw"><div class="chip" style="background:#163b7c"></div><span class="tok">--blue-600</span><span class="val">#163b7c</span></div><div class="sw"><div class="chip" style="background:#102e61"></div><span class="tok">--blue-700</span><span class="val">#102e61</span></div></div>
</body>
</html>
