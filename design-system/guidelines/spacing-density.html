<!-- @dsCard group="Spacing" viewport="700x190" name="Density: comfortable vs compact" subtitle="data-density reprices rows and controls; type sizes never change" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div data-density="comfortable">
  <p class="lbl" style="margin-bottom:6px">comfortable · row 38px</p>
  <table style="border:1px solid var(--border-hairline);border-radius:var(--radius-sm)">
    <tr><th class="lbl" style="padding:var(--space-4) var(--row-pad-x);background:var(--surface-sunken);border-bottom:1px solid var(--border-strong)">Account</th><th class="lbl" style="padding:var(--space-4) var(--row-pad-x);background:var(--surface-sunken);border-bottom:1px solid var(--border-strong);text-align:right">Debit</th></tr>
    <tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">1000</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">12,480.00</td></tr><tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">2100</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">8,204.00</td></tr><tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">6400</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">320.50</td></tr>
  </table>
</div><div data-density="compact">
  <p class="lbl" style="margin-bottom:6px">compact · row 28px</p>
  <table style="border:1px solid var(--border-hairline);border-radius:var(--radius-sm)">
    <tr><th class="lbl" style="padding:var(--space-4) var(--row-pad-x);background:var(--surface-sunken);border-bottom:1px solid var(--border-strong)">Account</th><th class="lbl" style="padding:var(--space-4) var(--row-pad-x);background:var(--surface-sunken);border-bottom:1px solid var(--border-strong);text-align:right">Debit</th></tr>
    <tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">1000</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">12,480.00</td></tr><tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">2100</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">8,204.00</td></tr><tr style="height:var(--row-h)"><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-mono)">6400</td><td style="padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border-table);font:var(--type-amount);text-align:right">320.50</td></tr>
  </table>
</div>
</div>
</body>
</html>
