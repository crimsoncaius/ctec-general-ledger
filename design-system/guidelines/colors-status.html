<!-- @dsCard group="Colors" viewport="700x130" name="Status hues" subtitle="Muted on purpose — a ledger exception reads serious, not alarming" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><div class="chip" style="background:#e8f1ec"></div><span class="tok">--green-50</span><span class="val">#e8f1ec</span></div><div class="sw"><div class="chip" style="background:#b6d2c2"></div><span class="tok">--green-200</span><span class="val">#b6d2c2</span></div><div class="sw"><div class="chip" style="background:#17603f"></div><span class="tok">--green-600</span><span class="val">#17603f</span></div><div class="sw"><div class="chip" style="background:#fbf1dc"></div><span class="tok">--amber-50</span><span class="val">#fbf1dc</span></div><div class="sw"><div class="chip" style="background:#ecd5a0"></div><span class="tok">--amber-200</span><span class="val">#ecd5a0</span></div><div class="sw"><div class="chip" style="background:#8a5a00"></div><span class="tok">--amber-600</span><span class="val">#8a5a00</span></div><div class="sw"><div class="chip" style="background:#f9e9e9"></div><span class="tok">--red-50</span><span class="val">#f9e9e9</span></div><div class="sw"><div class="chip" style="background:#e6bcbd"></div><span class="tok">--red-200</span><span class="val">#e6bcbd</span></div><div class="sw"><div class="chip" style="background:#9b2226"></div><span class="tok">--red-600</span><span class="val">#9b2226</span></div></div>
</body>
</html>
