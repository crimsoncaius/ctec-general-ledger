<!-- @dsCard group="Type" viewport="700x150" name="Monospace and tabular figures" subtitle="JetBrains Mono for every amount, code, identifier and digest" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:8px">
  <div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px">--type-amount</span>
    <span style="font:var(--type-amount);font-variant-numeric:tabular-nums">1,204,880.00&nbsp;&nbsp;(320.50)&nbsp;&nbsp;0.00</span></div>
  <div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px">--type-mono</span>
    <span style="font:var(--type-mono)">BATCH-000148 · JE-2026-000482 · NORTHSTAR-01</span></div>
  <div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px">digest</span>
    <code style="font:var(--type-mono);font-size:var(--text-xs);background:var(--surface-sunken);border:1px solid var(--border-hairline);border-radius:var(--radius-xs);padding:1px 6px">9f2c41ab77de0031bb51c4e9a2f6d80cc1e5b34a9d77e0f2461a8bb35c07d9e14</code></div>
  <table style="margin-top:4px;width:auto">
    <tr><th class="lbl" style="padding-right:24px">Account</th><th class="lbl" style="text-align:right">Debit</th><th class="lbl" style="text-align:right;padding-left:24px">Credit</th></tr>
    <tr><td style="font:var(--type-mono)">1000</td><td style="font:var(--type-amount);text-align:right;font-variant-numeric:tabular-nums">12,480.00</td><td style="font:var(--type-amount);text-align:right;padding-left:24px;color:var(--text-muted)">—</td></tr>
    <tr><td style="font:var(--type-mono)">2100</td><td style="font:var(--type-amount);text-align:right;color:var(--text-muted)">—</td><td style="font:var(--type-amount);text-align:right;padding-left:24px;font-variant-numeric:tabular-nums">12,480.00</td></tr>
  </table>
</div>
</body>
</html>
