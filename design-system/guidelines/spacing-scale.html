<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="2px base, doubling loosely; 4/8/12/16 carry most layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row" style="align-items:flex-end;gap:14px">
<div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:2px;height:2px;background:var(--blue-300)"></span><span class="tok">1</span><span class="val">2</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:4px;height:4px;background:var(--blue-300)"></span><span class="tok">2</span><span class="val">4</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:6px;height:6px;background:var(--blue-300)"></span><span class="tok">3</span><span class="val">6</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:8px;height:8px;background:var(--blue-300)"></span><span class="tok">4</span><span class="val">8</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:12px;height:12px;background:var(--blue-300)"></span><span class="tok">5</span><span class="val">12</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:16px;height:16px;background:var(--blue-300)"></span><span class="tok">6</span><span class="val">16</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:20px;height:20px;background:var(--blue-300)"></span><span class="tok">7</span><span class="val">20</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:24px;height:24px;background:var(--blue-300)"></span><span class="tok">8</span><span class="val">24</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:32px;height:32px;background:var(--blue-300)"></span><span class="tok">9</span><span class="val">32</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:40px;height:40px;background:var(--blue-300)"></span><span class="tok">10</span><span class="val">40</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:48px;height:48px;background:var(--blue-300)"></span><span class="tok">11</span><span class="val">48</span></div><div class="sw" style="min-width:auto;align-items:center"><span style="display:block;width:64px;height:64px;background:var(--blue-300)"></span><span class="tok">12</span><span class="val">64</span></div>
</div>
</body>
</html>
