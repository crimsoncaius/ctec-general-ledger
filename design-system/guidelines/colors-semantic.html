<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="Author UI against these, never the raw ramps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<table>
<tr><td class="tok">--surface-page</td><td><span style="display:inline-block;width:60px;height:14px;background:var(--surface-page);border:1px solid var(--border-hairline)"></span></td>
    <td class="tok">--surface-card</td><td><span style="display:inline-block;width:60px;height:14px;background:var(--surface-card);border:1px solid var(--border-hairline)"></span></td>
    <td class="tok">--surface-header</td><td><span style="display:inline-block;width:60px;height:14px;background:var(--surface-header)"></span></td></tr>
<tr><td class="tok">--text-primary</td><td style="color:var(--text-primary)">Aa 900</td>
    <td class="tok">--text-secondary</td><td style="color:var(--text-secondary)">Aa 600</td>
    <td class="tok">--text-muted</td><td style="color:var(--text-muted)">Aa 500</td></tr>
<tr><td class="tok">--text-link</td><td><a href="#">Reference</a></td>
    <td class="tok">--border-hairline</td><td><span style="display:inline-block;width:60px;border-top:1px solid var(--border-hairline)"></span></td>
    <td class="tok">--border-focus</td><td><span style="display:inline-block;width:60px;height:14px;box-shadow:var(--focus-ring-tight)"></span></td></tr>
</table>
</body>
</html>
