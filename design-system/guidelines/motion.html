<!-- @dsCard group="Brand" viewport="700x120" name="Motion" subtitle="Short and functional; reduced-motion zeroes every duration" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<table style="width:auto">
<tr><td class="tok" style="width:150px">--duration-instant</td><td class="val" style="width:60px">60ms</td><td style="font:var(--type-body-sm);color:var(--text-secondary)">press feedback</td></tr><tr><td class="tok" style="width:150px">--duration-fast</td><td class="val" style="width:60px">120ms</td><td style="font:var(--type-body-sm);color:var(--text-secondary)">control hover, focus</td></tr><tr><td class="tok" style="width:150px">--duration-normal</td><td class="val" style="width:60px">180ms</td><td style="font:var(--type-body-sm);color:var(--text-secondary)">drawer, menu, banner entry</td></tr><tr><td class="tok" style="width:150px">--duration-slow</td><td class="val" style="width:60px">280ms</td><td style="font:var(--type-body-sm);color:var(--text-secondary)">progress fill</td></tr>
<tr><td class="tok">--ease-standard</td><td class="val" colspan="2">cubic-bezier(0.2, 0, 0.2, 1)</td></tr>
</table>
</body>
</html>
