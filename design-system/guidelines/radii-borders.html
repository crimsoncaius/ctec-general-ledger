<!-- @dsCard group="Spacing" viewport="700x120" name="Radii and borders" subtitle="Small radii throughout — 3px controls, 5px panels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row" style="gap:16px">
<div class="sw" style="min-width:88px"><span style="display:block;height:38px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:2px"></span><span class="tok">--radius-xs</span><span class="val">2px</span></div><div class="sw" style="min-width:88px"><span style="display:block;height:38px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:3px"></span><span class="tok">--radius-sm</span><span class="val">3px</span></div><div class="sw" style="min-width:88px"><span style="display:block;height:38px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:5px"></span><span class="tok">--radius-md</span><span class="val">5px</span></div><div class="sw" style="min-width:88px"><span style="display:block;height:38px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:8px"></span><span class="tok">--radius-lg</span><span class="val">8px</span></div><div class="sw" style="min-width:88px"><span style="display:block;height:38px;background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:999px"></span><span class="tok">--radius-pill</span><span class="val">999px</span></div>
<div class="sw" style="min-width:150px"><span style="display:block;height:38px;border-top:1px solid var(--border-hairline);border-bottom:2px solid var(--blue-500)"></span><span class="tok">hairline 1px / strong 2px</span></div>
</div>
</body>
</html>
