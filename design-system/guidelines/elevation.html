<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Hairline first; shadow only for things that float" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row" style="gap:18px;padding:6px 0 14px">
<div class="sw" style="min-width:150px"><span style="display:grid;place-items:center;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-raised);font:var(--type-label)">Card</span><span class="tok">--shadow-raised</span></div><div class="sw" style="min-width:150px"><span style="display:grid;place-items:center;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-menu);font:var(--type-label)">Menu</span><span class="tok">--shadow-menu</span></div><div class="sw" style="min-width:150px"><span style="display:grid;place-items:center;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-dialog);font:var(--type-label)">Dialog</span><span class="tok">--shadow-dialog</span></div>
<div class="sw" style="min-width:150px"><span style="display:grid;place-items:center;height:60px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--focus-ring);font:var(--type-label)">Focus</span><span class="tok">--focus-ring</span></div>
</div>
</body>
</html>
