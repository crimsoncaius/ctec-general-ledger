<!-- @dsCard group="Type" viewport="700x180" name="Composed type roles" subtitle="Use the role token, not raw size + weight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-h1</span><span style="font:var(--type-h1);">Journal batches</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-h2</span><span style="font:var(--type-h2);">Fiscal close preview</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-h3</span><span style="font:var(--type-h3);">Trial balance</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-body</span><span style="font:var(--type-body);">Posted entries cannot be edited. Corrections are new, linked reversal entries.</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-label</span><span style="font:var(--type-label);">Fiscal period</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-caption</span><span style="font:var(--type-caption);color:var(--text-muted)">Only open periods can receive postings.</span></div><div style="display:flex;gap:14px;align-items:baseline"><span class="tok" style="width:112px;flex:0 0 auto">--type-overline</span><span style="font:var(--type-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">ACCOUNT</span></div>
</div>
</body>
</html>
