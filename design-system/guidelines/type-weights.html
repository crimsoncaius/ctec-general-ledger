<!-- @dsCard group="Type" viewport="700x100" name="Weights and tracking" subtitle="300–700; headings tighten, overlines open up" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--surface-card); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
  .lbl { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
  .tok { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-muted); }
  .sw { display: flex; flex-direction: column; gap: 4px; min-width: 78px; }
  .chip { height: 42px; border-radius: var(--radius-sm); border: 1px solid rgba(23,27,34,0.08); }
  .val { font: var(--type-mono); font-size: var(--text-2xs); color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font: var(--type-body-sm); }
  td, th { text-align: left; padding: 4px 10px 4px 0; vertical-align: baseline; }
  
</style>
</head>
<body>
<div class="row" style="gap:18px">
<div class="sw" style="min-width:96px"><span style="font-size:19px;font-weight:300;color:var(--text-primary)">Light</span><span class="tok">300</span></div><div class="sw" style="min-width:96px"><span style="font-size:19px;font-weight:400;color:var(--text-primary)">Regular</span><span class="tok">400</span></div><div class="sw" style="min-width:96px"><span style="font-size:19px;font-weight:500;color:var(--text-primary)">Medium</span><span class="tok">500</span></div><div class="sw" style="min-width:96px"><span style="font-size:19px;font-weight:600;color:var(--text-primary)">Semibold</span><span class="tok">600</span></div><div class="sw" style="min-width:96px"><span style="font-size:19px;font-weight:700;color:var(--text-primary)">Bold</span><span class="tok">700</span></div>
</div>
<div style="margin-top:10px;display:flex;gap:22px">
  <span class="tok">--tracking-tight −0.011em</span><span class="tok">--tracking-normal 0</span><span class="tok">--tracking-caps 0.07em</span>
</div>
</body>
</html>
