<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Feedback components</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--surface-page); padding: 16px 20px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .cap { font: var(--type-overline); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../card-mount.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NEED = ["Banner","ProgressBar","EmptyState","Button"];
const DS = window.dsResolve(NEED) || {};
const missing = NEED.filter(n => typeof DS[n] !== "function");

const { Banner, ProgressBar, EmptyState, Button } = DS;
function Demo() {
  return (
    <div className="col" style={{ gap: 12 }}>
      <Banner tone="success" title="Batch BATCH-000148 posted">Twelve lines committed in one transaction. Posted detail is now immutable.</Banner>
      <Banner tone="warning" title="Partial success — 8 of 11 batches validated" actions={<Button size="sm" variant="secondary">View 3 failures</Button>}>
        Three batches reference a closed period and were not transitioned.
      </Banner>
      <Banner tone="danger" title="Close could not be executed" correlationId="crl_7f31a9c2">
        The current preview is unbalanced by 320.50 USD. Execution stays unavailable until it reconciles.
      </Banner>
      <div style={{ background: "var(--surface-card)", border: "1px solid var(--border-hairline)", borderRadius: "var(--radius-md)", padding: 16 }}>
        <ProgressBar label="Integrity check" status="running" value={64} />
      </div>
      <div style={{ background: "var(--surface-card)", border: "1px solid var(--border-hairline)", borderRadius: "var(--radius-md)" }}>
        <EmptyState kind="no-match" icon="search-x" title="No batches match these filters" description="Clear the status filter to see all 42 batches in this company." />
      </div>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(missing.length ? React.createElement("p", { style: { font: "var(--type-body-sm)", color: "var(--text-muted)" } }, "Bundle not ready: " + missing.join(", ")) : React.createElement(Demo));
</script>
</body>
</html>
