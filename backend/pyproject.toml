[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctec-gl"
version = "0.1.0"
description = "Modern CTec General Ledger API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "dbfread>=2.0.7,<3",
  "fastapi>=0.116,<1",
  "email-validator>=2.2,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit==2.9.0",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.10,<5",
  "types-openpyxl>=3.1,<4",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "artifacts/coverage/backend-html"

[tool.coverage.xml]
output = "artifacts/coverage/backend.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
