name: ctec-stage6

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ctec_gl_stage6
      POSTGRES_USER: ctec_stage6
      POSTGRES_PASSWORD: stage6_local_only
    ports:
      - "${STAGE6_POSTGRES_PORT:-25432}:5432"
    volumes:
      - ctec_stage6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctec_stage6 -d ctec_gl_stage6"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ctec-gl-api:stage6
    build:
      context: ./backend
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ctec_stage6:stage6_local_only@db:5432/ctec_gl_stage6
      JWT_SECRET: stage6-only-secret-that-is-longer-than-thirty-two-characters
      CORS_ORIGINS: http://127.0.0.1:${STAGE6_WEB_PORT:-25173}
      INLINE_OPERATION_JOBS: "false"
    ports:
      - "${STAGE6_API_PORT:-28000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: ctec-gl-api:stage6
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ctec_stage6:stage6_local_only@db:5432/ctec_gl_stage6
      JWT_SECRET: stage6-only-secret-that-is-longer-than-thirty-two-characters
      CORS_ORIGINS: http://127.0.0.1:${STAGE6_WEB_PORT:-25173}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ctec-gl-web:stage6
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "${STAGE6_WEB_PORT:-25173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ctec_stage6_pgdata:
